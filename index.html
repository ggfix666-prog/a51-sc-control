<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>A51 SoundCloud Remote</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root { --bg: #121212; --card: #1e1e1e; --accent: #ff5500; --text: #fff; --muted: #a0a0a0; }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, 'SF Pro', system-ui, sans-serif; padding: 16px; min-height: 100vh; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.header h2 { font-size: 20px; font-weight: 800; }
.header h2 span { color: var(--accent); }
.status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #2ecc71; box-shadow: 0 0 8px #2ecc71; animation: p 2s infinite; }
@keyframes p { 0%,100%{opacity:1} 50%{opacity:.4} }
.tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.tab { flex: 1; padding: 10px; background: var(--card); border: none; border-radius: 10px; color: var(--muted); font-weight: 600; font-size: 13px; cursor: pointer; }
.tab.active { background: var(--accent); color: #fff; }
.refresh { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px; margin-bottom: 16px; background: var(--card); border: 1px dashed var(--accent); border-radius: 12px; color: var(--accent); font-weight: 600; cursor: pointer; }
.refresh:active { background: rgba(255,85,0,0.1); }
.track-list { display: flex; flex-direction: column; gap: 8px; }
.track-item { background: var(--card); padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 10px; }
.track-thumb { width: 44px; height: 44px; border-radius: 8px; background: #2a2a2a; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; overflow: hidden; }
.track-thumb img { width: 100%; height: 100%; object-fit: cover; }
.track-info { flex: 1; min-width: 0; }
.track-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track-artist { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track-actions { display: flex; gap: 6px; flex-shrink: 0; }
.btn-mini { background: var(--accent); color: #fff; border: none; border-radius: 8px; width: 38px; height: 38px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.btn-mini:active { transform: scale(0.9); }
.btn-mini.dl { background: #2a2a2a; }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }
.loading { text-align: center; padding: 40px; color: var(--muted); }
.section-title { font-size: 12px; font-weight: 700; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; margin: 16px 0 8px; }
.slider-block { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.slider-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13px; color: var(--muted); }
.slider-header b { color: var(--text); }
input[type=range] { width: 100%; -webkit-appearance: none; height: 6px; border-radius: 3px; background: #333; outline: none; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); }
.toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(0,0,0,0.9); color: #fff; padding: 12px 20px; border-radius: 30px; font-size: 14px; font-weight: 600; opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 100; }
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <h2>A51 <span>Sound</span></h2>
  <div class="status"><span class="dot"></span>online</div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('tracks', this)">🎧 Треки</button>
  <button class="tab" onclick="switchTab('sound', this)">🎛️ Звук</button>
</div>

<div id="tracks">
  <button class="refresh" onclick="refreshLikes()">🔄 Обновить лайки из SoundCloud</button>
  <div class="section-title">Лайкнутые треки</div>
  <div class="track-list" id="trackList">
    <div class="loading">Загрузка...</div>
  </div>
</div>

<div id="sound" style="display:none;">
  <div class="section-title">Громкость A51</div>
  <div class="slider-block">
    <div class="slider-header"><span>🔊 Уровень</span><b id="volValue">50%</b></div>
    <input type="range" min="0" max="100" value="50" id="vol"
      oninput="document.getElementById('volValue').textContent = this.value + '%'"
      onchange="send('volume|' + this.value)">
  </div>
  <button class="refresh" onclick="send('stop')" style="border-color:#e74c3c;color:#e74c3c;">⏹ Остановить воспроизведение</button>
</div>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const TRACKS_URL = 'https://raw.githubusercontent.com/ggfix666-prog/a51-sc-control/main/tracks.json';
let lastSent = 0;

function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tracks').style.display = name === 'tracks' ? 'block' : 'none';
  document.getElementById('sound').style.display = name === 'sound' ? 'block' : 'none';
}

function showToast(t) {
  const el = document.getElementById('toast');
  el.textContent = t;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1500);
}

function send(cmd) {
  const now = Date.now();
  if (now - lastSent < 400) return;
  lastSent = now;
  if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
  showToast('→ ' + cmd.split('|')[0]);
  tg.sendData(cmd);
}

async function loadTracks() {
  const list = document.getElementById('trackList');
  list.innerHTML = '<div class="loading">Загрузка...</div>';
  try {
    const r = await fetch(TRACKS_URL + '?t=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    const tracks = d.tracks || [];
    if (!tracks.length) {
      list.innerHTML = '<div class="empty">📭 Пока нет треков.<br>Нажми «Обновить лайки» выше.</div>';
      return;
    }
    list.innerHTML = '';
    tracks.forEach((t) => {
      const div = document.createElement('div');
      div.className = 'track-item';
      const thumb = t.thumb 
        ? `<div class="track-thumb"><img src="${t.thumb}" onerror="this.parentNode.textContent='🎵'"></div>`
        : '<div class="track-thumb">🎵</div>';
      const title = (t.title || 'Unknown').replace(/</g, '&lt;');
      const artist = (t.artist || '').replace(/</g, '&lt;');
      div.innerHTML = `
        ${thumb}
        <div class="track-info">
          <div class="track-title">${title}</div>
          <div class="track-artist">${artist}</div>
        </div>
        <div class="track-actions">
          <button class="btn-mini" onclick="send('play|${encodeURIComponent(t.url)}')">▶</button>
          <button class="btn-mini dl" onclick="send('download|${encodeURIComponent(t.url)}|${encodeURIComponent(t.title || "track")}')">⬇</button>
        </div>
      `;
      list.appendChild(div);
    });
  } catch (e) {
    list.innerHTML = `<div class="empty">❌ Ошибка: ${e.message}</div>`;
  }
}

function refreshLikes() {
  send('reload');
  showToast('🎧 Обновляю лайки... (30-60 сек)');
  setTimeout(loadTracks, 60000);
}

loadTracks();
</script>

</body>
</html>
